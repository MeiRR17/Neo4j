<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Neo4j v0.9.2 bounded source-link frequency and author chronology</title>
<desc id="d">Two private read-only graph analytics paths. First: up to fifty ordered incident SOURCE_LINK evidence records plus one lookahead produce an explicit denominator and status counts. Second: one evidence-linked source edge connects work author lifetime records, which are compared only with one dated author per distinct work. Rights, historical influence and release remain unverified.</desc>
<rect width="1200" height="630" rx="24" fill="#10192b"/>
<text x="52" y="62" fill="#f2f6fc" font-family="Arial,sans-serif" font-size="32" font-weight="700">Neo4j · v0.9.2  |  Research analytics</text>
<text x="52" y="96" fill="#b7c6db" font-family="Arial,sans-serif" font-size="18">Implementation diagram based on committed code — not a live UI screenshot</text>
<rect x="50" y="148" width="247" height="142" rx="15" fill="#223c60" stroke="#89a8d1" stroke-width="2"/>
<text x="70" y="185" fill="#f7fbff" font-family="Arial,sans-serif" font-weight="700" font-size="20">Private Research API</text>
<text x="70" y="224" fill="#dce8fa" font-family="Arial,sans-serif" font-size="16">Bearer / signed request</text>
<text x="70" y="254" fill="#dce8fa" font-family="Arial,sans-serif" font-size="16">Canonical passage IDs</text>
