<text x="393" y="207" fill="#d4f2ed" font-family="Arial,sans-serif" font-size="17">First 50 edges + 1 lookahead</text>
<text x="393" y="241" fill="#d4f2ed" font-family="Arial,sans-serif" font-size="17">Explicit sample denominator</text>
<text x="393" y="268" fill="#d4f2ed" font-family="Arial,sans-serif" font-size="16">Incoming / outgoing / review status</text>
<path d="M297 240 H330 V406 H371" stroke="#88bcf5" stroke-width="4" fill="none"/>
<path d="M357 398 l14 8 -14 8" stroke="#88bcf5" stroke-width="4" fill="none"/>
<rect x="371" y="319" width="393" height="171" rx="15" fill="#164e55" stroke="#54b8ad" stroke-width="2"/>
<text x="393" y="357" fill="#ffffff" font-family="Arial,sans-serif" font-weight="700" font-size="21">Author lifetime indicator</text>
<text x="393" y="394" fill="#d4f2ed" font-family="Arial,sans-serif" font-size="17">One eligible observed direct link</text>
<text x="393" y="427" fill="#d4f2ed" font-family="Arial,sans-serif" font-size="17">At most 2 authors per Work</text>
<text x="393" y="459" fill="#d4f2ed" font-family="Arial,sans-serif" font-size="17">Missing / ambiguous years → unknown</text>
<rect x="815" y="178" width="330" height="280" rx="15" fill="#4b392c" stroke="#dab381" stroke-width="2"/>
<text x="837" y="219" fill="#fffaf1" font-family="Arial,sans-serif" font-size="21" font-weight="700">Evidence safety checks</text>
<text x="837" y="264" fill="#f6dfc1" font-family="Arial,sans-serif" font-size="17">Matching Evidence nodes</text>
<text x="837" y="302" fill="#f6dfc1" font-family="Arial,sans-serif" font-size="17">Exact ID and status rules</text>
<text x="837" y="340" fill="#f6dfc1" font-family="Arial,sans-serif" font-size="17">No unlicensed source text</text>
<text x="837" y="378" fill="#f6dfc1" font-family="Arial,sans-serif" font-size="17">No verified composition dates</text>
<text x="837" y="416" fill="#f6dfc1" font-family="Arial,sans-serif" font-size="17">No historical influence claim</text>
