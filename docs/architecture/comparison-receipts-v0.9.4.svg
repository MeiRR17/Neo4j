<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
<title id="title">Neo4j v0.9.4 reproducible comparison receipts</title>
<desc id="description">Private request for two Work IDs retrieves ordered author metadata and directional evidence-linked graph samples. The validated comparison is encoded as sorted-key UTF-8 JSON and SHA-256 hashed. A separate SHA-256 is computed from fixed query templates. The unsigned receipt explicitly does not prove graph snapshot isolation, source rights, corpus completeness or historical influence.</desc>
