<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="475" viewBox="0 0 1120 475" role="img" aria-label="Neo4j v0.8.10 before and after projection stability guard code diagram">
<rect width="1120" height="475" rx="24" fill="#0d1728"/>
<text x="38" y="53" font-family="Arial,sans-serif" font-weight="bold" font-size="28" fill="#f8fafc">Neo4j v0.8.10 — Observed revision guard</text>
<text x="38" y="83" font-family="Arial,sans-serif" font-size="15" fill="#a5b4ca">Diagram of committed implementation; not a production screenshot</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="28" y="135" width="235" height="138" rx="14" fill="#1b2b44" stroke="#60a5fa" stroke-width="2"/>
