<text x="52" y="344" font-family="Arial,sans-serif" font-weight="bold" fill="#f8fafc" font-size="19">Research release: HOLD</text>
<text x="52" y="372" font-family="Arial,sans-serif" fill="#cbd5e1" font-size="15">Checks exposed titles/anchors and index state, not the complete immutable corpus.</text>
<text x="52" y="399" font-family="Arial,sans-serif" fill="#fca5a5" font-size="14">Aliases, editions, texts and edges are outside the fingerprint; no transactional snapshot.</text>
