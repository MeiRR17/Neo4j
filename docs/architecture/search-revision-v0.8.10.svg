<text x="145" y="229" fill="#cbd5e1" font-size="14">Index state + SHA256</text>
<rect x="302" y="135" width="230" height="138" rx="14" fill="#1b2b44" stroke="#a78bfa" stroke-width="2"/>
<text x="417" y="173" font-weight="bold" fill="white" font-size="18">Signed capture</text>
<text x="417" y="201" fill="#cbd5e1" font-size="14">Bearer + fresh HMAC</text>
<text x="417" y="229" fill="#cbd5e1" font-size="14">Bounded search pages</text>
<rect x="571" y="135" width="230" height="138" rx="14" fill="#1b2b44" stroke="#fbbf24" stroke-width="2"/>
<text x="686" y="173" font-weight="bold" fill="white" font-size="18">After capture</text>
