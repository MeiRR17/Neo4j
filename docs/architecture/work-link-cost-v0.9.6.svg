<text x="925" y="271" fill="#d8e6f8" font-family="Arial,sans-serif" font-size="16">2 review status fields</text>
<text x="925" y="307" fill="#d8e6f8" font-family="Arial,sans-serif" font-size="16">Bounded read-only</text>
