<text x="67" y="273" fill="#fff0ee" font-family="Arial,sans-serif" font-size="18">32 links: 4,366 dbHits</text>
<text x="67" y="305" fill="#fff0ee" font-family="Arial,sans-serif" font-size="18">128 links: 66,382 dbHits</text>
