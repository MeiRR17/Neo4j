<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Neo4j v0.9.6 index anchored work link optimization</title>
<desc id="desc">Before: two-sided Work link match cost 4366 dbHits at 32 synthetic links and 66382 dbHits at 128 links. After: an indexed source Passage lookup expands directed SOURCE_LINK then filters target Work and verifies Evidence, with new costs requiring CI validation. A delta pipeline compares sanitized metrics to the pinned historical benchmark.</desc>
<rect width="1200" height="630" rx="23" fill="#101927"/>
<text x="46" y="61" fill="#f2f6ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Neo4j / v0.9.6  —  Indexed graph traversal</text>
<text x="46" y="92" fill="#becadd" font-family="Arial,sans-serif" font-size="17">Code-derived implementation schematic, not a live UI screenshot</text>
