<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" role="img" aria-labelledby="title description">
<title id="title">Neo4j v0.9.7 four-case graph stress matrix architecture</title>
<desc id="description">Four deterministic CI synthetic fixture cases compare 256 or 512 edges with disjoint passages or one shared high-fanout source. After safety and namespace checks, four fixed PROFILE operations run three times per case. Sanitized cost and scaling data are archived for seven days and all exact synthetic node IDs cleaned. A separate v0.9.6 baseline gate remains. All research and production release claims HOLD.</desc>
<rect width="1240" height="700" rx="24" fill="#111a2b"/>
<text x="46" y="61" fill="#f2f6fc" font-family="Arial,sans-serif" font-weight="700" font-size="32">Neo4j  /  v0.9.7 — Fanout-sensitive stress matrix</text>
<text x="46" y="98" fill="#b7c8de" font-family="Arial,sans-serif" font-size="18">Code-derived visual, not a screenshot of running software</text>
<rect x="42" y="140" width="255" height="165" rx="16" fill="#263f63" stroke="#8caad4" stroke-width="2"/>
<text x="64" y="180" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="700">CI safety guard</text>
<text x="64" y="216" fill="#dfebfa" font-family="Arial,sans-serif" font-size="17">Explicit acknowledgment</text>
<text x="64" y="252" fill="#dfebfa" font-family="Arial,sans-serif" font-size="16">Loopback + absent IDs</text>
<text x="64" y="281" fill="#dfebfa" font-family="Arial,sans-serif" font-size="16">Synthetic nodes only</text>
