<text x="381" y="222" fill="#ddf4ec" font-family="Arial,sans-serif" font-size="18">Disjoint: 256 links  /  512 links</text>
<text x="381" y="265" fill="#ddf4ec" font-family="Arial,sans-serif" font-size="18">Hub: 256 links  /  512 links</text>
<text x="381" y="308" fill="#ddf4ec" font-family="Arial,sans-serif" font-size="18">Hub out-degree: 128  /  256</text>
<text x="381" y="352" fill="#ddf4ec" font-family="Arial,sans-serif" font-size="17">Same 2 Works + authors; unique Evidence</text>
