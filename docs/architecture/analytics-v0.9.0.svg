<text x="62" y="196" fill="#d3e0f3" font-family="Arial,sans-serif" font-size="15">canonical passage ID</text>
<text x="62" y="222" fill="#d3e0f3" font-family="Arial,sans-serif" font-size="15">strict filters; up to 20 rows</text>
