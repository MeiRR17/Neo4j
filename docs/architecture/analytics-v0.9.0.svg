<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">v0.9.0 evidence-linked analytics first slice</title>
<desc id="desc">An authenticated canonical passage request enters one of two fixed read-only Cypher operations, observed source links and shared target candidates. Both retain exact Evidence identities and review states, then return bounded private metadata, not verified influence.</desc>
