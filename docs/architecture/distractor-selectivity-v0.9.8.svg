<text x="208" y="514" font-family="Arial,sans-serif" fill="#d6eaf4" font-size="17">1,102 dbHits in every case  ·  Ratio 1.0  ·  7-day artifact  ·  no production claim</text>
<text x="40" y="589" font-family="Arial,sans-serif" fill="#f9d6a8" font-size="18" font-weight="700">v0.9.8 selectivity gate <=1.25x; prior cost guards unchanged. Research release: HOLD.</text>
