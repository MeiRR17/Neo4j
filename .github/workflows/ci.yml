name: Research graph checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Research API dependencies
        run: python -m pip install -r requirements/research-api-test.txt
      - name: Unit, API and security contract tests
        run: python -m unittest discover -s tests -v
      - name: Offline frozen search-quality fixture and anti-inflation gate
        run: |
          python scripts/search_quality_eval.py \
            --judgments tests/fixtures/search_quality_judgments_synthetic.json \
            --responses tests/fixtures/search_quality_responses_synthetic.json
      - name: Offline reviewer packet safety and empty-form smoke
        run: |
          python scripts/search_review_workflow.py prepare \
            --questions tests/fixtures/search_review_questions_synthetic.json \
            --responses tests/fixtures/search_quality_responses_synthetic.json \
            --output /tmp/neo4j-v088-review-packet.json
          python scripts/search_review_workflow.py template \
            --packet /tmp/neo4j-v088-review-packet.json \
            --reviewer-id SYNTHETIC_CI_A \
            --output /tmp/neo4j-v088-review-form.json
      - name: Validate Docker Compose model (no image pull)
        run: |
          python scripts/bootstrap.py
          docker compose config --quiet
          docker compose config --format json > /tmp/neo4j-compose-config.json
          python - <<'PY'
          import json
          with open("/tmp/neo4j-compose-config.json", encoding="utf-8") as f:
              config = json.load(f)
          published = config["services"]["neo4j"]["ports"]
          assert len(published) == 2
          assert all(item.get("host_ip") == "127.0.0.1" for item in published)
          assert "neo4j_auth_file" in config["services"]["neo4j"]["secrets"][0]["source"]
          print("Compose validated: local-only ports + Docker secret.")
          PY
      - name: Start isolated Neo4j and verify authentication
        run: |
          docker compose up -d
          if ! docker compose up -d --wait --wait-timeout 180; then
            echo "Neo4j startup diagnostics (credentials redacted):"
            docker compose ps --all
            docker compose logs --no-color --tail=80 neo4j | sed -E 's#neo4j/[A-Za-z0-9_-]{16,}#neo4j/[REDACTED]#g'
            exit 1
          fi
          python scripts/smoke.py --timeout 30
      - name: Apply and validate versioned graph migrations
        run: |
          python scripts/migrate.py dry-run
          python scripts/migrate.py apply
          python scripts/migrate.py apply
          python scripts/migrate.py check
          python scripts/ontology_smoke.py --allow-synthetic
      - name: Sefaria metadata quality and idempotent graph integration (synthetic only)
        run: |
          python scripts/ingest_sefaria.py plan-csv \
            --input tests/fixtures/sefaria_links_synthetic.csv \
            --source-uri https://storage.googleapis.com/sefaria-export/links/links0.csv \
            --output local_staging/fixture --fixture
          python scripts/ingest_sefaria.py apply \
            --input local_staging/fixture --ack-unreviewed --ci-fixture
          python scripts/ingest_sefaria.py apply \
            --input local_staging/fixture --ack-unreviewed --ci-fixture
      - name: Scholarly seed edition metadata smoke (synthetic only)
        run: |
          python scripts/seed_corpus.py --help
          python scripts/seed_smoke.py
      - name: Authenticated Research API + real Neo4j smoke (synthetic only)
        run: |
          python scripts/api_bootstrap.py
          python scripts/api_smoke.py
      - name: Plan, apply and verify metadata-only search index (isolated CI)
        run: |
          python scripts/search_index_backfill.py dry-run --kind works
          python scripts/search_index_backfill.py apply --kind works --ack-metadata-only
          python scripts/search_index_backfill.py check --kind works
      - name: Record bounded index EXPLAIN and fixture-only PROFILE evidence
        run: |
          python scripts/search_index_plan.py --kind works --prefix synthetic
          python scripts/search_index_plan.py --kind works --prefix synthetic --profile --ack-disposable-fixture
      - name: Signed DvirOS service identity and live Neo4j bridge
        run: |
          python scripts/api_signature_bootstrap.py
          python scripts/bridge_smoke.py
      - name: Verify actual data persistence across restart
        run: python scripts/persistence_smoke.py
      - name: Stop local test environment
        if: always()
        run: docker compose down
