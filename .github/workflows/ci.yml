name: Research graph checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Research API dependencies
        run: python -m pip install -r requirements/research-api-test.txt
      - name: Unit, API and security contract tests
        run: PYTHONPATH=scripts python -m unittest discover -s tests -v
      - name: Offline frozen search-quality fixture and anti-inflation gate
        run: |
          python scripts/search_quality_eval.py \
            --judgments tests/fixtures/search_quality_judgments_synthetic.json \
            --responses tests/fixtures/search_quality_responses_synthetic.json
      - name: Offline reviewer packet safety and empty-form smoke
        run: |
          python scripts/search_review_workflow.py prepare \
            --questions tests/fixtures/search_review_questions_synthetic.json \
            --responses tests/fixtures/search_quality_responses_synthetic.json \
            --output /tmp/neo4j-v088-review-packet.json
          python scripts/search_review_workflow.py template \
            --packet /tmp/neo4j-v088-review-packet.json \
            --reviewer-id SYNTHETIC_CI_A \
            --output /tmp/neo4j-v088-review-form.json
      - name: Signed localhost capture HMAC, cursor chain and denial tests
        run: PYTHONPATH=scripts python -m unittest tests.test_search_capture -v
      - name: Bounded observed revision pin and drift rejection unit smoke
        run: PYTHONPATH=scripts python -m unittest tests.test_search_revision -v
      - name: Source, edition and evidence provenance contract tests
        run: PYTHONPATH=scripts python -m unittest tests.test_source_provenance -v
      - name: Local retained source receipt and signature-negative tests
        run: PYTHONPATH=scripts python -m unittest tests.test_source_receipts -v
      - name: Complete bounded source membership and capture HMAC unit tests
        run: PYTHONPATH=scripts python -m unittest tests.test_source_membership -v
      - name: Pinned Ed25519 archive attestation and trust-policy denial tests
        run: PYTHONPATH=scripts python -m unittest tests.test_external_archive_attestation -v
      - name: AWS version-pinned HEAD, SHA256 and Object Lock validation (mocked only)
        run: PYTHONPATH=scripts python -m unittest tests.test_live_s3_version_verify -v
      - name: AWS STS identity, bucket controls and spaced retention samples (mocked)
        run: PYTHONPATH=scripts python -m unittest tests.test_s3_governance -v
      - name: Validate Docker Compose model (no image pull)
        run: |
          python scripts/bootstrap.py
          docker compose config --quiet
          docker compose config --format json > /tmp/neo4j-compose-config.json
          python - <<'PY'
          import json
          with open("/tmp/neo4j-compose-config.json", encoding="utf-8") as f:
              config = json.load(f)
          published = config["services"]["neo4j"]["ports"]
          assert len(published) == 2
          assert all(item.get("host_ip") == "127.0.0.1" for item in published)
          assert "neo4j_auth_file" in config["services"]["neo4j"]["secrets"][0]["source"]
          print("Compose validated: local-only ports + Docker secret.")
          PY
      - name: Start isolated Neo4j and verify authentication
        run: |
          docker compose up -d
          if ! docker compose up -d --wait --wait-timeout 180; then
            echo "Neo4j startup diagnostics (credentials redacted):"
            docker compose ps --all
            docker compose logs --no-color --tail=80 neo4j | sed -E 's#neo4j/[A-Za-z0-9_-]{16,}#neo4j/[REDACTED]#g'
            exit 1
          fi
          python scripts/smoke.py --timeout 30
      - name: Apply and validate versioned graph migrations
        run: |
          python scripts/migrate.py dry-run
          python scripts/migrate.py apply
          python scripts/migrate.py apply
          python scripts/migrate.py check
          python scripts/ontology_smoke.py --allow-synthetic
      - name: Sefaria metadata quality and idempotent graph integration (synthetic only)
        run: |
          python scripts/ingest_sefaria.py plan-csv \
            --input tests/fixtures/sefaria_links_synthetic.csv \
            --source-uri https://storage.googleapis.com/sefaria-export/links/links0.csv \
            --output local_staging/fixture --fixture
          python scripts/ingest_sefaria.py apply \
            --input local_staging/fixture --ack-unreviewed --ci-fixture
          python scripts/ingest_sefaria.py apply \
            --input local_staging/fixture --ack-unreviewed --ci-fixture
      - name: Scholarly seed edition metadata smoke (synthetic only)
        run: |
          python scripts/seed_corpus.py --help
          python scripts/seed_smoke.py
      - name: Authenticated Research API + real Neo4j smoke (synthetic only)
        run: |
          python scripts/api_bootstrap.py
          python scripts/api_smoke.py
      - name: Bounded synthetic graph cost profiles (32 and 128 SOURCE_LINK records)
        run: |
          mkdir -p local_staging
          python scripts/analytics_cost_benchmark.py \
            --ack-disposable-fixture > local_staging/analytics-cost-v095.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("local_staging/analytics-cost-v095.json").read_text())
          assert report["schema_version"] == "0.9.5"
          assert report["research_release_status"] == "HOLD"
          assert report["real_corpus_benchmarked"] is False
          assert report["representative_performance_proven"] is False
          assert [case["size"] for case in report["sizes"]] == [32, 128]
          assert all(len(case["operation_profiles"]) == 4 for case in report["sizes"])
          for case in report["sizes"]:
              for plan in case["operation_profiles"]:
                  assert plan["source_values_exposed"] is False
                  assert plan["representative_performance_proven"] is False
          print("[OK] Isolated 32/128-link cost evidence verified; "
                "report artifact contains no rows, credentials or text.")
          PY
      - name: Retain sanitized synthetic analytics cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: analytics-cost-v095-synthetic
          path: local_staging/analytics-cost-v095.json
          if-no-files-found: error
          retention-days: 7
      - name: Compare anchored graph dbHits with pinned v0.9.5 CI baseline
        run: |
          python scripts/analytics_cost_delta_v096.py \
            --input local_staging/analytics-cost-v095.json \
            --output local_staging/analytics-delta-v096.json \
            --require-synthetic-cost-gate
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("local_staging/analytics-delta-v096.json").read_text())
          assert report["schema_version"] == "0.9.6"
          assert report["baseline_run_id"] == 43099681819
          assert report["fixture_scales"] == [32, 128]
          assert report["regression_gate_enforced"] is True
          assert report["synthetic_regression_gate_passed"] is True
          assert report["research_release_status"] == "HOLD"
          assert not report["representative_performance_proven"]
          print("[OK] v0.9.6 fixed-fixture dbHits regression gate passed; "
                "the threshold is synthetic-only and not a production SLO.")
          PY
      - name: Retain sanitized v0.9.6 anchored cost comparison
        uses: actions/upload-artifact@v4
        with:
          name: analytics-delta-v096-synthetic
          path: local_staging/analytics-delta-v096.json
          if-no-files-found: error
          retention-days: 7
      - name: Stress-test 256 and 512 synthetic SOURCE_LINK topologies
        run: |
          python scripts/analytics_stress_v097.py \
            --ack-disposable-fixture > local_staging/analytics-stress-v097.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.analytics_stress_fixture_v097 import CASES
          report = json.loads(Path("local_staging/analytics-stress-v097.json").read_text())
          assert report["schema_version"] == "0.9.7"
          assert report["case_order"] == list(CASES)
          assert len(report["case_results"]) == 4
          assert list(report["growth_by_topology"]) == ["disjoint", "hub"]
          assert report["research_release_status"] == "HOLD"
          assert report["representative_performance_proven"] is False
          assert report["real_corpus_benchmarked"] is False
          assert report["query_regression_gate_enforced"] is False
          for case in report["case_results"]:
              assert case["source_link_count"] in (256, 512)
              assert case["topology"] in ("disjoint", "hub")
              assert len(case["operations"]) == 4
              for metric in case["operations"]:
                  assert metric["source_values_disclosed"] is False
                  assert metric["db_hits_max"] <= 250_000
                  assert metric["samples"] == 3
          print("[OK] Synthetic disjoint/hub stress evidence complete; "
                "not a representative production-performance claim.")
          PY
      - name: Enforce measured synthetic hub and disjoint cost ceilings
        run: |
          python scripts/analytics_stress_gate_v097.py \
            --input local_staging/analytics-stress-v097.json \
            --output local_staging/analytics-stress-gate-v097.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("local_staging/analytics-stress-gate-v097.json").read_text())
          assert report["schema_version"] == "0.9.7"
          assert report["fixed_fixture_budget_enforced"] is True
          assert report["synthetic_stress_gate_passed"] is True
          assert report["representative_performance_proven"] is False
          assert report["research_release_status"] == "HOLD"
          print("[OK] 256/512 synthetic hub/disjoint cost regression guard passed; "
                "not a production SLA or scholarly-quality claim.")
          PY
      - name: Retain sanitized synthetic hub versus disjoint cost profiles
        uses: actions/upload-artifact@v4
        with:
          name: analytics-stress-v097-synthetic
          path: |
            local_staging/analytics-stress-v097.json
            local_staging/analytics-stress-gate-v097.json
          if-no-files-found: error
          retention-days: 7
      - name: Profile unrelated-Work distractor isolation (128 selected plus 0/128/512 unrelated)
        run: |
          python scripts/analytics_distractor_v098.py \
            --ack-disposable-fixture > local_staging/analytics-distractors-v098.json
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.analytics_distractor_fixture_v098 import CASES
          doc = json.loads(Path("local_staging/analytics-distractors-v098.json").read_text())
          assert doc["schema_version"] == "0.9.8"
          assert doc["case_order"] == list(CASES)
          assert doc["fixed_selected_source_links"] == 128
          assert [case["distractor_source_link_count"] for case in doc["case_results"]] == [0, 128, 512]
          assert all(case["work_count"] == 4 and len(case["operations"]) == 4 for case in doc["case_results"])
          assert all(metric["source_values_disclosed"] is False and metric["samples"] == 3
                     for case in doc["case_results"] for metric in case["operations"])
          assert doc["research_release_status"] == "HOLD"
          assert doc["new_cost_gate_enforced"] is False
          assert doc["representative_performance_proven"] is False
          print("[OK] Three four-Work selectivity fixtures, 36 sanitized PROFILE observations; "
                "synthetic diagnostic only, not production validation.")
          PY
      - name: Enforce unrelated-Work selectivity and query-cost budgets
        run: |
          python scripts/analytics_distractor_gate_v098.py \
            --input local_staging/analytics-distractors-v098.json \
            --output local_staging/analytics-distractor-gate-v098.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("local_staging/analytics-distractor-gate-v098.json").read_text())
          assert summary["schema_version"] == "0.9.8"
          assert summary["synthetic_selectivity_gate_passed"] is True
          assert summary["fixed_fixture_budget_enforced"] is True
          assert summary["maximum_interference_ratio"] == 1.25
          assert summary["production_slo_verified"] is False
          assert summary["research_release_status"] == "HOLD"
          print("[OK] Four-Work synthetic selectivity gate passed; "
                "not a production SLO, source authenticity or scholarly approval.")
          PY
      - name: Archive sanitized four-Work distractor selectivity measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-distractors-v098-synthetic
          path: |
            local_staging/analytics-distractors-v098.json
            local_staging/analytics-distractor-gate-v098.json
          if-no-files-found: warn
          retention-days: 7
      - name: Plan, apply and verify metadata-only search index (isolated CI)
        run: |
          python scripts/search_index_backfill.py dry-run --kind works
          python scripts/search_index_backfill.py apply --kind works --ack-metadata-only
          python scripts/search_index_backfill.py check --kind works
      - name: Record bounded index EXPLAIN and fixture-only PROFILE evidence
        run: |
          python scripts/search_index_plan.py --kind works --prefix synthetic
          python scripts/search_index_plan.py --kind works --prefix synthetic --profile --ack-disposable-fixture
      - name: Signed DvirOS service identity and live Neo4j bridge
        run: |
          python scripts/api_signature_bootstrap.py
          python scripts/bridge_smoke.py
      - name: Signed metadata snapshot capture against real CI Neo4j
        run: python scripts/capture_smoke.py
      - name: Retained synthetic source bytes versus live signed SourceRecord
        run: python scripts/source_receipt_smoke.py
      - name: Complete captured source chain with mocked S3 governance and STS
        run: python scripts/source_membership_smoke.py
      - name: Verify actual data persistence across restart
        run: python scripts/persistence_smoke.py
      - name: Stop local test environment
        if: always()
        run: docker compose down
